# Example overrides for a shared staging install.
# Copy beside the app; do not commit real passwords or keys.
# First-release profile: shared only. Do not set private-cidrs.

delivery.install.mode=shared
delivery.install.production=true
delivery.dry-run=false
delivery.admin-email=admin@example.com
delivery.admin-password=REPLACE_ME
delivery.public-base-url=https://staging.example.com
delivery.provider.allowlist=ollama
delivery.store-root=./delivery-store
delivery.work-dir=./delivery-work
spring.h2.console.enabled=false
spring.datasource.username=sa
spring.datasource.password=REPLACE_ME
server.port=8080

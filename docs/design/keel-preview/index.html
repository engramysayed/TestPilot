else if(a.startsWith('device:')){const adb=a.slice(7);const d=deviceRegistry.find(x=>x.adb===adb)||deviceRegistry[0];modal(d.name,'<div class="summaryline"><span>ADB serial</span><b>'+d.adb+'</b></div><div class="summaryline"><span>Runner</span><b>'+d.runner+'</b></div><div class="summaryline"><span>Appium</span>'+badge(d.appium==='Ready'?'pass':'fail',d.appium)+'</div><div class="summaryline"><span>Reservation</span><b>'+d.state+'</b></div>'+(d.blockedRun?'<div class="intermittency">Blocked Execute run <span class="mono">'+d.blockedRun+'</span></div>':'')+'<p class="sub">Illustrative device record.</p>')}
else if(a==='runner')modal('Connect your local runner',`<p>Run the device agent on the computer connected to your emulator or phone.</p><div class="code" style="margin:18px 0">1. Enroll a runner in this workspace\n2. Configure the local agent\n3. Verify Appium and ADB readiness\n4. Choose a connected device</div><div class="note">Concept only. No token is created or software installed.</div>`);else if(a.startsWith('gen:tab:')){genTab=a.slice(8);render()}else if(a==='gen:bulk:template'){const blob=new Blob(['US_ID,Title,Story\nUS_01,Checkout total review,"As a customer I want to review order total before confirming."\nUS_02,Empty address rejection,"Reject checkout when delivery address is missing."'],{type:'text/csv'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='keel-user-stories-bulk-template.csv';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}else if(a==='gen:bulk:queue'){if(!genBulkFileSelected){toast('Select a bulk stories CSV first.');return}const jobId='JOB-'+String(Math.floor(Math.random()*9000+1000));bulkJobsHistory.unshift({id:jobId,status:'Queued',progress:'0/8',tcs:0});genBulkFileSelected=false;startMockJob('GENERATE_BULK',{total:8,jobId});toast('Bulk generate queued — opening status page.')}else if(a==='gen:start'){startMockJob('GENERATE_BATCH',{total:3})}else if(a==='gen:compare'){startMockJob('GENERATE_COMPARE',{total:4})}else if(a==='gen:review'){genReviewOpen=true;render()}else if(a==='gen:reviewrun'){toast('AI review running in preview — proposal shown below.')}else if(a==='gen:acceptreview'){toast('Accepted review fixes locally.');genReviewOpen=false;render()}else if(a==='gen:save'){genPreview?.forEach(r=>{if(!cases.find(c=>c[0]===r.id))cases.push([r.id,r.title,r.tags.split(',')[0]||'Generated','Unchecked',r.priority]);caseEditor[r.id]={title:r.title,call:'',preconditions:'',priority:r.priority,tags:r.tags,keelPath:r.path,visualAssertion:'',rows:r.rows.map(x=>({...x}))}});libRevision++;genJustSaved=true;render();toast('Saved '+genPreview.length+' cases to preview library as revision '+libRevision+'.')}else if(a==='gen:dismiss'){genJustSaved=false;render()}else if(a==='gen:csv'){const blob=new Blob(['TC_ID,Title,KeelPath,Priority,Tags\n'+genPreview.map(r=>`${r.id},${r.title},${r.path},${r.priority},${r.tags}`).join('\n')],{type:'text/csv'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='keel-generated-preview.csv';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}else if(a.startsWith('gen:edit:')){const id=a.slice(9);const row=genPreview?.find(r=>r.id===id);if(!row)return;genSelectedRow=id;modal('Edit generated case · '+id,`<label class="field"><span>Title</span><input id="gen-edit-title" value="${row.title}"></label><label class="field" style="margin-top:14px"><span>KeelPath</span><select id="gen-edit-path"><option ${row.path==='AUTOMATE'?'selected':''}>AUTOMATE</option><option ${row.path==='EXECUTE'?'selected':''}>EXECUTE</option><option ${row.path==='VISION_ONLY'?'selected':''}>VISION_ONLY</option><option ${row.path==='MANUAL'?'selected':''}>MANUAL</option></select></label><div class="align-table"><div class="align-head"><span>#</span><span>Step</span><span>Test data</span><span>Expected</span><span></span></div><div id="align-rows">${row.rows.map(alignRowHtml).join('')}</div></div>${btn('Add step','align:add','small')}`,btn('Save row','gen:saverow:'+id,'primary'),true)}else if(a.startsWith('gen:saverow:')){const id=a.slice(12);const row=genPreview?.find(r=>r.id===id);if(row){row.title=document.getElementById('gen-edit-title')?.value||row.title;row.path=document.getElementById('gen-edit-path')?.value||row.path;row.rows=[...document.querySelectorAll('#align-rows .align-row')].map(rw=>({step:rw.querySelector('.align-step')?.value||'',data:rw.querySelector('.align-data')?.value||'',expected:rw.querySelector('.align-expected')?.value||''}))}close();render();toast('Updated '+id+' in generate preview.')}else if(a==='gen:compareview'){modal('Model comparison',`<div class="summaryline"><span>Model A (gemma3:4b)</span><b>${genDraftRows.length} cases</b></div><div class="summaryline"><span>Model B (qwen2.5:7b)</span><b>${genDraftRows.length-1} cases</b></div><div class="step"><div><h3>TC_GEN_03 only in Model A</h3><p>Order history capture flow assigned AUTOMATE path.</p></div></div>`,btn('Keep Model A','gen:save','primary'))}else if(a.startsWith('exec:tab:')){execTab=a.slice(9);render()}else if(a.startsWith('exec:source:')){execWorkbookSource=a.slice(12);render()}else if(a==='exec:pick'){modal('Select cases to run',`<p class="sub">No selection = run all library cases.</p>${allCaseIds().map(id=>`<label style="display:block;font-size:12px;margin:8px 0"><input type="checkbox" class="check exec-pick" value="${id}" ${execSelectedCases.has(id)?'checked':''}> <span class="mono">${id}</span> · ${caseMeta(id).title}</label>`).join('')}`,btn('Apply selection','exec:applypick','primary'))}else if(a==='exec:applypick'){execSelectedCases=new Set([...document.querySelectorAll('.exec-pick:checked')].map(x=>x.value));close();render();toast(execSelectedCases.size?execSelectedCases.size+' cases selected.':'All library cases will run.')}else if(a==='exec:acceptreview'){execPreReview=false;toast('Pre-run review accepted.');render()}else if(a==='exec:dismissreview'){execPreReview=false;render()}else if(a==='exec:start'){if(execPreReview){toast('Accept or dismiss pre-run review findings first.');return}startMockJob('EXECUTE',{total:execSelectedCases.size||6})}else if(a==='exec:results'){execTab='results';go('execute')}else if(a.startsWith('exec:export:')){const kind=a.slice(12);const names={csv:'bug-report-preview.csv',xlsx:'execute-results-preview.xlsx',shots:'screenshots-preview.zip'};const blob=new Blob(['Keel design preview export — '+kind],{type:'text/plain'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=names[kind]||'export.txt';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);toast('Downloaded preview '+kind+' export.')}else if(a==='auto:start'){startMockJob('CONVERT',{total:2})}else if(a==='job:cancel'){if(activeJob){activeJob.status='FAILED';activeJob.message='Cancelled by user.';syncBulkJobFromActive();clearInterval(jobPollTimer);jobPollTimer=null;render();toast('Job force-stopped in preview.')}}else if(a==='job:download'){const label=activeJob?.kind==='GENERATE_BATCH'||activeJob?.kind==='GENERATE_BULK'?'keel-generated.csv':activeJob?.kind==='CONVERT'?'framework-preview.zip':'job-artifact.txt';const blob=new Blob(['Keel design preview download for '+activeJob?.id],{type:'text/plain'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=label;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}else if(a==='generated'){startMockJob('GENERATE_BATCH',{total:3})}else if(a==='apk')modal('Upload an APK',`<label class="field"><span>Android application</span><input type="file" accept=".apk"></label><p class="sub" style="margin-top:12px">Preview only. No APK is uploaded, installed or inspected.</p>`);else if(a==='properties')modal('Appium properties',`<div class="code">appium.serverUrl=http://127.0.0.1:4723<br>appium.automationName=UiAutomator2<br>appium.udid=emulator-5554<br>appium.app=<br>appium.appPackage=com.axis.demo<br>appium.appActivity=com.axis.demo.MainActivity<br>appium.appWaitActivity=com.axis.demo.MainActivity</div><p class="sub" style="margin-top:12px">Illustrative settings. The downloaded framework reads editable properties; Java has no device-specific constants.</p>`);else if(a==='previewlogin'){go('overview');toast('Sample workspace opened. No authentication request was sent.')}else if(a==='requestaccess')modal('Request access',`<label class="field"><span>Work email</span><input placeholder="you@company.com"></label><label class="field" style="margin-top:18px"><span>Tell us about your testing needs</span><textarea rows="3"></textarea></label><p class="sub">Preview only. No request will be sent.</p>`,btn('Preview request','saved','primary'));else if(a==='invite')modal('Invite a member',`<label class="field"><span>Email</span><input placeholder="teammate@example.test"></label><label class="field" style="margin-top:18px"><span>Role</span><select><option>Member · Read only</option><option>Admin · Operate</option></select></label><p class="sub" style="margin-top:12px">Design only. No email is sent and no access is granted.</p>`,btn('Preview invitation','saved','primary'));else if(a==='access')modal('Review access request',`<p>Confirm the person, workspace and intended role before granting access.</p><div class="summaryline"><span>Requested role</span><b>Member · Read only</b></div><div class="note">This preview does not grant access or send messages.</div>`,btn('Preview approval','saved','primary'));else if(a==='api')modal('CI job API',`<div class="code">POST /api/v1/…\nAuthorization: Bearer [service identity]\nIdempotency-Key: [unique request key]</div><p class="sub" style="margin-top:15px">Design placeholder. The final UI links to the verified API reference.</p>`)});
document.addEventListener('input',e=>{if(e.target.id==='caseSearch')filterLibRows();if(e.target.id==='call-search'){const box=document.getElementById('call-results');if(box){const q=e.target.value.toLowerCase();box.querySelectorAll('.call-opt').forEach(b=>b.classList.toggle('hide',q&&!b.textContent.toLowerCase().includes(q)));box.classList.toggle('hide',!q&&!box.querySelector('.call-opt:not(.hide)'))}}});
document.addEventListener('change',e=>{if(e.target.dataset?.action?.startsWith('exec:source:')){execWorkbookSource=e.target.dataset.action.slice(12);render()}if(e.target.dataset?.action?.startsWith('proj:engine:')){projMeta().engine=e.target.dataset.action.slice(12);render()}if(e.target.id==='appSource'){toast(e.target.value.startsWith('Already')?'Installed-app mode: package and launch activity select the app.':'APK mode: app metadata is detected with editable overrides.')}if(e.target.id==='statusFilter')filterLibRows();if(e.target.id==='genPathFilter'){genFilterPath=e.target.value;render()}if(e.target.id==='gen-bulk-file'){genBulkFileSelected=!!e.target.files?.length}if(e.target.id==='gen-bulk-review'){genBulkReview=e.target.checked}if(e.target.id==='auto-final-revise'){autoFinalRevise=e.target.checked;toast(autoFinalRevise?'Final revise enabled — reduces soft-block risk on Automate.':'Final revise off — Automate may complete with soft block.')}if(e.target.id==='exec-pre-review'){execPreReview=e.target.checked;render()}if(e.target.id==='allCases')document.querySelectorAll('.casecheck').forEach(c=>c.checked=e.target.checked);if(e.target.classList.contains('casecheck')||e.target.id==='allCases'){const n=document.querySelectorAll('.casecheck:checked').length;const el=document.getElementById('selectionLabel');if(el)el.textContent=n+' cases selected · Library revision '+libRevision+(n?' · Prerequisites included when applicable':'')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if((e.key==='Enter'||e.key===' ')&&e.target.matches('.projectcard')){e.preventDefault();e.target.click()}if(e.key==='Enter'&&e.target.id==='globalSearch'){const q=e.target.value.toLowerCase();const match=navs.find(n=>n[1].toLowerCase().includes(q));if(match&&q)go(match[0]);else toast('Try projects, library, runs, automation, devices or settings.')}if(e.key==='Tab'&&document.querySelector('.modal')){let els=[...document.querySelectorAll('.modal button,.modal input,.modal select,.modal textarea')];if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}});
render();

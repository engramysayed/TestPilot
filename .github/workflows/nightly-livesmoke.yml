name: Nightly LiveSmoke (opt-in)
# D-QA-12: deterministic default CI stays green without browsers/Ollama.
# This job is schedule + manual only and requires explicit secrets.
on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC
  workflow_dispatch:
    inputs:
      suite:
        description: 'Surefire -Dtest filter (LiveSmoke classes)'
        required: false
        default: '*LiveSmoke*'
jobs:
  livesmoke:
    runs-on: ubuntu-latest
    # Fail closed if secrets missing — do not silently skip and look green
    steps:
      - name: Require opt-in secrets
        env:
          KEEL_LIVESMOKE: ${{ secrets.KEEL_LIVESMOKE }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ "${KEEL_LIVESMOKE:-}" != "1" ]]; then
            echo "KEEL_LIVESMOKE secret must be '1' to run nightly LiveSmoke." >&2
            echo "Default PR/release CI remains deterministic without this job." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install Chromium deps (Ubuntu)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium || true
      - name: Run LiveSmoke suite
        env:
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          KEEL_LIVESMOKE: ${{ secrets.KEEL_LIVESMOKE }}
        run: |
          set -euo pipefail
          FILTER='${{ github.event.inputs.suite }}'
          if [[ -z "$FILTER" || "$FILTER" == "null" ]]; then FILTER='*LiveSmoke*'; fi
          mvn -B test -pl keel-portal -am \
            -Dtest="$FILTER" \
            -Dsurefire.failIfNoSpecifiedTests=false

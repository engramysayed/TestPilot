name: Fencing/auth green (D-QA-03)
on:
  pull_request:
    paths:
      - 'src/main/java/delivery/portal/jobs/DurableJobClaim.java'
      - 'src/main/java/delivery/portal/service/PortalStore.java'
      - 'src/main/java/delivery/portal/api/v1/PrivateRunnerApiController.java'
      - 'src/test/java/delivery/job/DurableJobClaimTest.java'
      - 'src/test/java/delivery/portal/api/PrivateRunnerApiTest.java'
      - 'src/test/java/delivery/portal/api/JobCompareApiTest.java'
      - '.github/workflows/fencing-auth-green.yml'
  workflow_dispatch:
jobs:
  fencing-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Focused fencing/auth suite (must stay green)
        run: |
          set -euo pipefail
          mvn -B -o test -pl keel-portal -am \
            -Dtest=DurableJobClaimTest,PrivateRunnerApiTest,JobCompareApiTest \
            -Dsurefire.failIfNoSpecifiedTests=false

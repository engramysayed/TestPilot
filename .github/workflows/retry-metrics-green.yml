name: Retry metrics green (D-QA-04)
on:
  pull_request:
    paths:
      - 'src/main/java/delivery/job/Retry*.java'
      - 'src/main/java/delivery/job/RunHealth.java'
      - 'src/main/java/delivery/job/ProvePhase.java'
      - 'src/main/java/delivery/job/ExecuteJobResult.java'
      - 'src/main/java/delivery/portal/service/RetryMetricsView.java'
      - 'src/test/java/delivery/job/HonestRetryMetricsTest.java'
      - 'src/test/java/delivery/portal/service/RetryMetricsViewTest.java'
      - '.github/workflows/retry-metrics-green.yml'
  workflow_dispatch:
jobs:
  retry-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Honest retry + first-pass view fields
        run: |
          set -euo pipefail
          mvn -B -o test -pl keel-portal -am \
            -Dtest=HonestRetryMetricsTest,RetryMetricsViewTest \
            -Dsurefire.failIfNoSpecifiedTests=false
          # Contract: firstPassRate / finalPassRate symbols exist on tip
          grep -q 'firstPassRate' src/main/java/delivery/job/ExecuteJobResult.java
          grep -q 'class RetryVerdict' src/main/java/delivery/job/RetryVerdict.java

name: release

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Deterministic tests
        # LiveSmoke tests are excluded by -Pdeterministic (**/*LiveSmoke*).
        # Shared/Dedicated install drills are excluded here and run as their own JVMs below.
        run: mvn -B -Pdeterministic test
        env:
          MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      - name: Shared install drill (own JVM)
        run: mvn -B "-Dtest=delivery.ops.SharedInstallDrillTest" "-Ddelivery.install.drill=shared" "-Dinstall.drills.skip=true" test
        env:
          MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      - name: Dedicated install drill (own JVM)
        run: mvn -B "-Dtest=delivery.ops.DedicatedInstallDrillTest" "-Ddelivery.install.drill=dedicated" "-Dinstall.drills.skip=true" test
        env:
          MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      - name: Compile customer framework template
        run: mvn -B -f customer-framework-template/pom.xml -DskipTests compile
      - name: Dependency inventory
        run: mkdir -p target && mvn -B -q dependency:tree > target/dependency-tree.txt
      - name: Artifact checksums
        run: |
          mkdir -p target/provenance
          find customer-framework-template -type f \( -name "*.java" -o -name "pom.xml" \) -print0 | sort -z | xargs -0 sha256sum > target/provenance/template.sha256
          sha256sum pom.xml src/main/resources/application.properties > target/provenance/root.sha256
          echo "sha256 provenance written"
      - name: Secret scan (no committed provider keys)
        run: |
          if grep -R --include='*.properties' --include='*.yml' --include='*.env' -E 'CURSOR_API_KEY=[^P]|AGENTROUTER_API_KEY=[^$]' .; then
            echo "Possible committed provider key" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          # B02 multi-module: surefire reports land under keel-*/target/ (not root target/).
          # Keep root target/ paths for dependency-tree / provenance written by earlier steps.
          if-no-files-found: warn
          path: |
            keel-*/target/surefire-reports/
            target/surefire-reports/
            target/dependency-tree.txt
            target/provenance/

  benchmark:
    runs-on: ubuntu-latest
    needs: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: browser-actions/setup-chrome@v1
      - name: P0-03 committed-revision benchmark
        run: mvn -B "-Dtest=ReleaseBenchmarkP003Test,ReuseEligibilityTest" test
        env:
          BROWSER_HEADLESS: "true"
          EXECUTION_TYPE: "HEADLESS"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-evidence
          if-no-files-found: warn
          path: |
            keel-*/target/surefire-reports/
            target/surefire-reports/

  # B09 (SPLIT_DESIGN rev 10): EngineIsolationIT, CI only. Portal and engine are two processes with disjoint data
  # roots; the engine reaches the portal only by URL + runner token. Never run on the company machine.
  engine-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: EngineIsolationIT (separate data roots)
        run: mvn -B -pl keel-portal -am test "-Dtest=EngineIsolationIT" "-Dsurefire.failIfNoSpecifiedTests=false"
        env:
          CI: "true"

  engine-isolation-windows:
    # Engine root on a different drive letter (subst E:), portal root on the checkout drive.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Map engine root to E:
        shell: cmd
        run: |
          mkdir "%RUNNER_TEMP%\keel-engine-root"
          subst E: "%RUNNER_TEMP%\keel-engine-root"
      - name: EngineIsolationIT (engine on E:)
        shell: cmd
        run: mvn -B -pl keel-portal -am test "-Dtest=EngineIsolationIT" "-Dsurefire.failIfNoSpecifiedTests=false" "-Dkeel.it.engine-root=E:\engine"
        env:
          CI: "true"

  # B10 (OPS §12.5 Part A item 1): hard-coded hosts/paths check.
  hardcoded-hosts-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check for hard-coded hosts and paths
        run: scripts/ci/check-hardcoded.sh

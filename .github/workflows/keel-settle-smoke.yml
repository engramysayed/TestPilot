# Settle / CI smoke + optional full portal suite with known-9 allowlist (series 0045).
# Smoke filter matches the box QA run on impl-r45 (2026-10-14): must stay green.
# Full allowlist job is workflow_dispatch / nightly only (~16 min) — fails only on NEW failures.
# No company-machine infra (no firewall, Squid, VPN, certs, new ports).
name: keel-settle-smoke

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # 21:00 UTC daily (same window as customer E2E cron intent)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      run_full_allowlist:
        description: "Also run full keel-portal suite and apply known-9 allowlist"
        type: boolean
        default: true

jobs:
  settle-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Settle / CI smoke (must be green)
        run: >
          mvn -B -pl keel-portal -am
          "-Dtest=SettlePolicyFrozenTest,SettlePolicyParityTest,SettleNetworkPropertiesTest,CiReporterTemplateTest,FrameworkPackagerTest#settleResourcesAndGitattributesShip,TcExecutionServiceKeepIrFieldsTest"
          "-Dsurefire.failIfNoSpecifiedTests=false"
          test
        env:
          MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settle-smoke-surefire
          if-no-files-found: warn
          path: |
            keel-*/target/surefire-reports/
            target/surefire-reports/

  portal-full-allowlist:
    # Nightly / manual: full portal tests; exit 0 only if failures ⊆ known-failures-product.txt
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_full_allowlist)
    runs-on: ubuntu-latest
    needs: settle-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Full keel-portal suite (continue on test failures)
        # surefire fails the build on test failures; capture exit code and still run the allowlist check
        run: |
          set +e
          mvn -B -pl keel-portal -am test
          echo "MVN_EXIT=$?" >> "$GITHUB_ENV"
        env:
          MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      - name: Fail only on NEW failures (known-9 allowlist)
        run: |
          python3 .github/keel/check-known-failures.py \
            --allowlist .github/keel/known-failures-product.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-full-allowlist-surefire
          if-no-files-found: warn
          path: |
            keel-*/target/surefire-reports/
            target/surefire-reports/

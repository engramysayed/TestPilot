# User-owned test-data overrides.
#
# Keel NEVER writes to this file. Keel regenerates delivery-testdata.properties
# wholesale on every Automate run, so any manual edit to that file is lost.
# Put the keys you want to preserve here instead: PropertyReader loads this
# file LAST, so its values win over the generated ones.
#
# Example:
#   TC_LOGIN.body.type.email.1 = my-prod-user@example.com
#   TC_CHECKOUT.body.type.cardNumber.1 = ${MY_SECRET_CARD}
#
# Runtime -D<key>=<value> still wins over everything here, same as before.

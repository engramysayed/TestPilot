<!doctype html><html><head><meta charset="utf-8"><title>Sidebar 60</title>
<style>body{margin:0;display:flex;font-family:sans-serif}nav{width:220px;height:400px;overflow-y:auto;border-right:1px solid #ccc}
nav li{padding:8px;cursor:pointer;list-style:none}main{padding:16px}</style></head><body>
<nav id="side" aria-label="Main"><ul id="menu"></ul></nav>
<main><h1>Dashboard</h1><button id="refresh" data-gt="refresh">Refresh</button><p id="out">none</p></main>
<script>
const names=[];for(let i=1;i<=60;i++)names.push(i===50?'Support':i===58?'Audit Log':'Section '+i);
const ul=document.getElementById('menu');
names.forEach((n,i)=>{const li=document.createElement('li');li.textContent=n;li.setAttribute('data-gt','side-'+(i+1));
 li.onclick=()=>{document.getElementById('out').textContent=n};ul.appendChild(li);});
</script></body></html>

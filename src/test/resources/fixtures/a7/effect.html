<!doctype html><html><head><meta charset="utf-8"><style>body{font:14px sans-serif;margin:10px} canvas{border:1px solid #ccc}</style></head><body>
<p>Clock: <span id="clock" data-keel-volatile>0</span></p>
<button id="change" onclick="document.getElementById('out').textContent='changed '+Date.now()">Change</button>
<button id="noop" onclick="void 0">No-op</button>
<button id="paint" onclick="var c=document.getElementById('cv').getContext('2d');c.fillStyle='#d00';c.fillRect(20,20,120,60);">Paint</button>
<button id="delayed" onclick="setTimeout(function(){document.getElementById('out').textContent='late'},700)">Delayed</button>
<button id="toggle" aria-expanded="false" onclick="this.setAttribute('aria-expanded', this.getAttribute('aria-expanded')==='true'?'false':'true')">Menu</button>
<button id="flaky" onclick="window.__n=(window.__n||0)+1; if(window.__n>=2) document.getElementById('out').textContent='second try'">Flaky</button>
<p id="out">idle</p>
<canvas id="cv" width="200" height="100"></canvas>
<script>var t=0;setInterval(function(){document.getElementById('clock').textContent=String(++t)},50);</script>
</body></html>

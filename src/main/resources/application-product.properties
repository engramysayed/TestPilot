# Product / live profile — devices allowed when this profile is active.
# Activate: SPRING_PROFILES_ACTIVE=product (start-portal.cmd defaults this when unset)
#           or --spring.profiles.active=product
# CI and default tests do NOT load this file; base application.properties keeps mobile=false.
# Dual opt-in for CI labs still requires keel.mobile.ci-opt-in=true in addition to enabled=true.
delivery.mobile.enabled=true
# APK inspect uses apkanalyzer/aapt2 on PATH (see keel-env.local.bat after Scoop android-clt + build-tools).

# Live installs: refuse to boot on schema drift instead of auto-adding columns at startup.
# The base profile keeps 'update' so tests and dev work normally; product requires explicit
# migrations (see delivery.portal.db.FencingTokenColumnMigration, RolesSchemaMigration for
# the pattern). If the portal refuses to start after an entity change, add a migration.
spring.jpa.hibernate.ddl-auto=validate

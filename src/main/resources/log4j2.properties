#Log files location
property.basePath = ${sys:user.dir}/test-output/default-run

appender.file.type = File
appender.file.name = fileAppender
appender.file.fileName = ${basePath}/logs/logs.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = [%p] - [%d{dd-MM-yyyy HH:mm:ss}] [%t] [%c] - %msg%n

appender.file.filter.threshold.type = ThresholdFilter
appender.file.filter.threshold.level = debug

appender.stdout.type = Console
appender.stdout.name = consoleAppender
appender.stdout.layout.type = PatternLayout
appender.stdout.layout.pattern = %highlight{[%p] - [%d{dd-MM-yyyy HH:mm:ss}] [%t] [%c] - %msg%n}{FATAL=red,ERROR=red,WARN=yellow,INFO=green,DEBUG=cyan,TRACE=blue}

appender.stdout.filter.threshold.type = ThresholdFilter
appender.stdout.filter.threshold.level = debug

# Frameworks log a full SQL/AST dump per progress poll (~1/s), which buries the run output.
logger.hibernate.name = org.hibernate
logger.hibernate.level = warn
logger.spring.name = org.springframework
logger.spring.level = warn
logger.h2.name = com.zaxxer.hikari
logger.h2.level = warn
logger.selenium.name = org.openqa.selenium
logger.selenium.level = warn

rootLogger.level = info
rootLogger.appenderRefs = stdout, file
rootLogger.appenderRef.stdout.ref = consoleAppender
rootLogger.appenderRef.file.ref = fileAppender
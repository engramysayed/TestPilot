<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Sign in — Keel</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/css/portal.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="login-body">
<main class="login-split" aria-label="Sign in">
    <section class="login-form-pane">
        <div class="login-form-card">
            <p class="guide-kicker">Welcome back</p>
            <h1>Sign in to Keel</h1>
            <p th:if="${param.registered}" class="ok">Account created. Please sign in.</p>
            <p th:if="${param.logout}" class="muted">Signed out.</p>
            <p th:if="${param.error}" class="error">Wrong email or password.</p>
            <form th:action="@{/login}" method="post" class="login-form">
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <label>Email
                    <input type="email" name="username" required autocomplete="username" placeholder="you@company.com"/>
                </label>
                <label>Password
                    <input type="password" name="password" required autocomplete="current-password"/>
                </label>
                <button type="submit" class="button login-submit">Sign in</button>
            </form>
            <p class="login-alt">
                <a class="button ghost login-request-btn" href="/request-access">Request access</a>
            </p>
        </div>
    </section>
    <aside class="login-brand-pane" aria-label="Keel">
        <div class="login-brand-inner login-brand-minimal">
            <img class="login-logo" th:src="@{/img/keel-logo.svg}" alt="" width="88" height="88"/>
            <p class="login-brand-name">Keel</p>
            <p class="login-slogan">Give It the Task. Wake Up to Results.</p>
        </div>
    </aside>
</main>
</body>
</html>

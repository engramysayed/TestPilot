<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments :: pageHead(title='Roles')}"></th:block>
</head>
<body class="app-body">
<aside th:replace="~{fragments :: sidebar}"></aside>
<div class="app-main">
<header th:replace="~{fragments :: topbar}"></header>
<main class="shell keel-page" th:attr="data-roles-ui=${rolesUiEnabled} ?: true">
    <div class="page-title">
        <div>
            <h1>Roles &amp; permissions</h1>
            <p class="lede">Create custom roles and choose what each role can do. Approving a user still happens on Users — pick a role there every time.</p>
        </div>
        <button type="button" class="button primary" id="btn-new-role">New role</button>
    </div>

    <section class="panel keel-role-editor" id="role-editor" hidden>
        <h2 id="role-editor-title">New role</h2>
        <p class="panel-intro">Open the list and tick only what this role needs.</p>
        <label class="f">Name
            <input type="text" id="role-name" placeholder="e.g. QA lead" autocomplete="off"/>
        </label>
        <label class="f">Description <span class="muted">(optional)</span>
            <input type="text" id="role-desc" placeholder="Short plain summary"/>
        </label>
        <div id="perm-checklist" class="keel-perm-grid" aria-label="Permissions"></div>
        <p id="role-editor-err" class="error" hidden></p>
        <p>
            <button type="button" class="button primary" id="role-save">Save role</button>
            <button type="button" class="button ghost" id="role-cancel">Cancel</button>
        </p>
    </section>

    <section class="panel">
        <h2>Roles</h2>
        <div id="role-list" class="keel-role-list" aria-live="polite"></div>
        <p id="role-list-err" class="error" hidden></p>
    </section>
</main>
</div>
<script>
(function () {
  var editingId = null;
  var catalog = [];
  var permMs = null;
  document.addEventListener('click', function (ev) {
    if (!permMs || permMs.contains(ev.target)) return;
    var drop = permMs.querySelector('.tc-ms-dropdown');
    var trigger = permMs.querySelector('.tc-ms-trigger');
    if (drop) drop.hidden = true;
    permMs.classList.remove('is-open');
    if (trigger) trigger.setAttribute('aria-expanded', 'false');
  });

  async function api(url, opts) {
    opts = opts || {};
    opts.credentials = 'same-origin';
    opts.headers = Object.assign({ 'Accept': 'application/json', 'X-Keel-Requested-With': 'Keel' }, opts.headers || {});
    var res = await fetch(url, opts);
    var data = await res.json().catch(function () { return {}; });
    return { ok: res.ok, status: res.status, data: data };
  }

  function renderChecklist(selected) {
    selected = selected || [];
    var box = document.getElementById('perm-checklist');
    box.className = 'tc-multiselect';
    box.innerHTML = '';

    var label = document.createElement('span');
    label.className = 'tc-ms-label';
    label.textContent = 'Permissions';
    box.appendChild(label);

    var ms = document.createElement('div');
    ms.className = 'tc-ms';
    ms.id = 'perm-ms';

    var trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'tc-ms-trigger';
    trigger.id = 'perm-ms-trigger';
    trigger.setAttribute('aria-haspopup', 'listbox');
    trigger.setAttribute('aria-expanded', 'false');
    var chips = document.createElement('span');
    chips.className = 'tc-ms-chips';
    chips.id = 'perm-ms-chips';
    var summary = document.createElement('span');
    summary.className = 'tc-ms-summary muted';
    summary.id = 'perm-ms-summary';
    summary.textContent = 'None selected';
    var caret = document.createElement('span');
    caret.className = 'tc-ms-caret';
    caret.setAttribute('aria-hidden', 'true');
    trigger.appendChild(chips);
    trigger.appendChild(summary);
    trigger.appendChild(caret);

    var drop = document.createElement('div');
    drop.className = 'tc-ms-dropdown';
    drop.id = 'perm-ms-dropdown';
    drop.hidden = true;

    var search = document.createElement('input');
    search.type = 'search';
    search.className = 'tc-ms-search';
    search.placeholder = 'Search permissions';
    search.autocomplete = 'off';

    var toolbar = document.createElement('div');
    toolbar.className = 'tc-ms-toolbar';
    var allBtn = document.createElement('button');
    allBtn.type = 'button';
    allBtn.className = 'button ghost';
    allBtn.textContent = 'Select all';
    var noneBtn = document.createElement('button');
    noneBtn.type = 'button';
    noneBtn.className = 'button ghost';
    noneBtn.textContent = 'Clear';
    toolbar.appendChild(allBtn);
    toolbar.appendChild(noneBtn);

    var list = document.createElement('div');
    list.className = 'tc-ms-list';
    list.setAttribute('role', 'listbox');

    catalog.forEach(function (p) {
      var lab = document.createElement('label');
      lab.className = 'tc-ms-option generate-check';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.setAttribute('data-code', p.code);
      cb.checked = selected.indexOf(p.code) >= 0;
      var text = document.createElement('span');
      var title = document.createElement('b');
      title.textContent = p.label || p.code;
      var meta = document.createElement('span');
      meta.className = 'muted perm-code';
      meta.textContent = p.code + (p.group ? ' · ' + p.group : '');
      text.appendChild(title);
      text.appendChild(meta);
      lab.appendChild(cb);
      lab.appendChild(text);
      lab.setAttribute('data-search', ((p.label || '') + ' ' + p.code + ' ' + (p.group || '')).toLowerCase());
      cb.addEventListener('change', refreshPermSummary);
      list.appendChild(lab);
    });

    search.addEventListener('input', function () {
      var q = search.value.trim().toLowerCase();
      Array.prototype.forEach.call(list.children, function (lab) {
        lab.hidden = q.length > 0 && lab.getAttribute('data-search').indexOf(q) < 0;
      });
    });
    allBtn.addEventListener('click', function () {
      Array.prototype.forEach.call(list.querySelectorAll('input'), function (cb) {
        if (!cb.parentElement.hidden) cb.checked = true;
      });
      refreshPermSummary();
    });
    noneBtn.addEventListener('click', function () {
      Array.prototype.forEach.call(list.querySelectorAll('input'), function (cb) { cb.checked = false; });
      refreshPermSummary();
    });
    trigger.addEventListener('click', function () {
      var open = drop.hidden;
      drop.hidden = !open;
      ms.classList.toggle('is-open', open);
      trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) search.focus();
    });
    permMs = ms;

    drop.appendChild(search);
    drop.appendChild(toolbar);
    drop.appendChild(list);
    ms.appendChild(trigger);
    ms.appendChild(drop);
    box.appendChild(ms);
    refreshPermSummary();
  }

  function refreshPermSummary() {
    var chips = document.getElementById('perm-ms-chips');
    var summary = document.getElementById('perm-ms-summary');
    if (!chips || !summary) return;
    var picked = selectedPerms();
    chips.innerHTML = '';
    var labels = picked.map(function (code) {
      var found = catalog.filter(function (p) { return p.code === code; })[0];
      return found && found.label ? found.label : code;
    });
    labels.slice(0, 3).forEach(function (name) {
      var chip = document.createElement('span');
      chip.className = 'tc-ms-chip';
      chip.textContent = name;
      chips.appendChild(chip);
    });
    if (labels.length > 3) {
      var more = document.createElement('span');
      more.className = 'tc-ms-chip tc-ms-chip-more';
      more.textContent = '+' + (labels.length - 3);
      chips.appendChild(more);
    }
    summary.textContent = labels.length === 0
      ? 'None selected'
      : labels.length + (labels.length === 1 ? ' permission' : ' permissions');
  }

  function selectedPerms() {
    return Array.prototype.map.call(document.querySelectorAll('#perm-checklist input:checked'), function (el) {
      return el.getAttribute('data-code');
    });
  }

  async function loadCatalog() {
    var r = await api('/api/admin/permissions');
    if (!r.ok) throw new Error(r.data.message || 'Cannot load permissions');
    catalog = r.data.permissions || [];
  }

  async function loadRoles() {
    var err = document.getElementById('role-list-err');
    err.hidden = true;
    var r = await api('/api/admin/roles');
    if (!r.ok) { err.hidden = false; err.textContent = r.data.message || 'Admin only'; return; }
    var list = document.getElementById('role-list');
    list.innerHTML = '';
    var roles = r.data.roles || [];
    if (roles.length === 0) {
      list.innerHTML = '<p class="empty-state muted" id="role-list-empty">No roles yet. Create a role to choose what each person can do.</p>';
      return;
    }
    roles.forEach(function (role) {
      var card = document.createElement('article');
      card.className = 'keel-role-card';

      var head = document.createElement('div');
      head.className = 'keel-role-card-head';

      var identity = document.createElement('div');
      identity.className = 'keel-role-card-id';
      var title = document.createElement('h3');
      title.appendChild(document.createTextNode(role.name || 'Role'));
      if (role.system) {
        var badge = document.createElement('span');
        badge.className = 'keel-badge keel-badge--approved';
        badge.textContent = 'Built-in';
        title.appendChild(badge);
      }
      identity.appendChild(title);
      if (role.description) {
        var desc = document.createElement('p');
        desc.className = 'keel-role-desc';
        desc.textContent = role.description;
        identity.appendChild(desc);
      }

      var meta = document.createElement('div');
      meta.className = 'keel-role-card-meta';
      var count = document.createElement('span');
      count.className = 'keel-role-count';
      var n = Number(role.userCount || 0);
      count.textContent = n + (n === 1 ? ' user' : ' users');
      meta.appendChild(count);

      var actions = document.createElement('div');
      actions.className = 'keel-role-card-actions';
      var edit = document.createElement('button');
      edit.type = 'button'; edit.className = 'button ghost'; edit.textContent = 'Edit';
      edit.addEventListener('click', function () { openEditor(role); });
      actions.appendChild(edit);
      if (!role.system) {
        var del = document.createElement('button');
        del.type = 'button'; del.className = 'button danger'; del.textContent = 'Delete';
        del.addEventListener('click', async function () {
          var ok = await (window.keelConfirm || function(o){return Promise.resolve(confirm(o.message||o));})({
            title: 'Delete role',
            message: 'Delete role ' + role.name + '?',
            confirmLabel: 'Delete',
            danger: true
          });
          if (!ok) return;
          var d = await api('/api/admin/roles/' + encodeURIComponent(role.roleId), { method: 'DELETE' });
          if (!d.ok) {
            await (window.keelAlert || function(m){alert(typeof m==='string'?m:m.message);return Promise.resolve();})(d.data.message || 'Delete failed');
            return;
          }
          loadRoles();
        });
        actions.appendChild(del);
      }
      meta.appendChild(actions);

      var chips = document.createElement('ul');
      chips.className = 'keel-perm-chips';
      (role.permissions || []).forEach(function (code) {
        var li = document.createElement('li');
        li.textContent = code;
        chips.appendChild(li);
      });

      head.appendChild(identity);
      head.appendChild(meta);
      card.appendChild(head);
      card.appendChild(chips);
      list.appendChild(card);
    });
  }

  function openEditor(role) {
    editingId = role ? role.roleId : null;
    document.getElementById('role-editor').hidden = false;
    document.getElementById('role-editor-title').textContent = role ? ('Edit ' + role.name) : 'New role';
    document.getElementById('role-name').value = role ? role.name : '';
    document.getElementById('role-name').disabled = !!(role && role.system);
    document.getElementById('role-desc').value = role ? (role.description || '') : '';
    document.getElementById('role-editor-err').hidden = true;
    renderChecklist(role ? role.permissions : []);
  }

  document.getElementById('btn-new-role').addEventListener('click', function () { openEditor(null); });
  document.getElementById('role-cancel').addEventListener('click', function () {
    document.getElementById('role-editor').hidden = true; editingId = null;
  });
  document.getElementById('role-save').addEventListener('click', async function () {
    var err = document.getElementById('role-editor-err');
    err.hidden = true;
    var body = { name: document.getElementById('role-name').value, description: document.getElementById('role-desc').value, permissions: selectedPerms() };
    var r;
    if (editingId) {
      r = await api('/api/admin/roles/' + encodeURIComponent(editingId), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    } else {
      r = await api('/api/admin/roles', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    }
    if (!r.ok) { err.hidden = false; err.textContent = r.data.message || 'Save failed'; return; }
    document.getElementById('role-editor').hidden = true;
    editingId = null;
    loadRoles();
  });

  var root = document.querySelector('main.keel-page');
  var rolesUi = root && root.getAttribute('data-roles-ui');
  if (rolesUi === 'false') {
    var list = document.getElementById('role-list');
    if (list) {
      list.innerHTML = '<p class="empty-state muted" id="role-list-disabled">Roles admin is turned off for this workspace.</p>';
    }
    var btn = document.getElementById('btn-new-role');
    if (btn) btn.hidden = true;
    return;
  }

  loadCatalog().then(loadRoles).catch(function (e) {
    var err = document.getElementById('role-list-err');
    err.hidden = false; err.textContent = e.message || 'Failed to load';
  });
})();
</script>
</body>
</html>

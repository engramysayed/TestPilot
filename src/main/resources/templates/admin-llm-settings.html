<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments :: pageHead(title='LLM Settings · Keys & models')}"></th:block>
</head>
<body class="app-body">
<aside th:replace="~{fragments :: sidebar}"></aside>
<div class="app-main">
<header th:replace="~{fragments :: topbar}"></header>
<main class="shell keel-page">
    <div class="page-title">
        <div>
            <h1>LLM Settings</h1>
        </div>
    </div>
    <nav class="tabs" aria-label="LLM Settings sections">
        <a href="/admin/llm-settings" class="active">Keys &amp; models</a>
        <a href="/admin/authoring-verbs">Authoring verbs</a>
    </nav>
    <section class="panel">
        <p class="ok" id="llm-saved" hidden>Saved. Runtime settings updated for this process.</p>
        <p class="error" id="llm-error" hidden></p>
        <form class="llm-settings-form" id="llm-settings-form" onsubmit="return false;">
            <div class="form-grid" style="display:grid;gap:1rem;max-width:40rem;">
                <label>Ollama base URL
                    <input type="url" id="ollamaBaseUrl" name="ollamaBaseUrl"
                           placeholder="http://127.0.0.1:11434" autocomplete="off"
                           th:value="${ollamaBaseUrl ?: 'http://127.0.0.1:11434'}">
                </label>
                <label>Ollama API key <span class="muted">(optional)</span>
                    <input type="password" id="ollamaApiKey" name="ollamaApiKey" autocomplete="new-password" placeholder="">
                    <span class="muted" id="ollamaApiKeyHint"></span>
                </label>
                <div class="generate-model-row" style="display:flex;gap:0.75rem;align-items:flex-end;flex-wrap:wrap;">
                    <label style="flex:1;min-width:12rem;">Chat model
                        <select id="ollamaChatModel" name="ollamaChatModel">
                            <option value="">— loading models —</option>
                            <option th:each="name : ${cachedOllamaModels}" th:value="${name}" th:text="${name}"
                                    th:selected="${name == ollamaChatModel}"></option>
                        </select>
                    </label>
                    <label style="flex:1;min-width:12rem;">Vision model
                        <select id="ollamaVisionModel" name="ollamaVisionModel">
                            <option value="">— loading models —</option>
                            <option th:each="name : ${cachedOllamaModels}" th:value="${name}" th:text="${name}"
                                    th:selected="${name == ollamaVisionModel}"></option>
                        </select>
                    </label>
                    <button type="button" class="btn" id="btn-refresh-models">Refresh models</button>
                </div>
                <p class="muted" id="llm-models-hint">Loads from Ollama at the base URL. If this still says loading, click Refresh models.</p>
                <label>Cursor API key
                    <input type="password" id="cursorApiKey" name="cursorApiKey" autocomplete="new-password" placeholder="">
                    <span class="muted" id="cursorApiKeyHint"></span>
                </label>
                <label>AgentRouter API key
                    <input type="password" id="agentrouterApiKey" name="agentrouterApiKey" autocomplete="new-password" placeholder="">
                    <span class="muted" id="agentrouterApiKeyHint"></span>
                </label>
                <label>Review cases per batch
                    <input type="number" id="reviewCasesPerBatch" name="reviewCasesPerBatch" min="1" max="50" value="50">
                    <span class="muted">When more than 5 cases are selected, review splits into batches of this size (1–50). Default 50.</span>
                </label>
                <label>Browser
                    <select id="browser" name="browser">
                        <option value="edge">Edge</option>
                        <option value="chrome">Chrome</option>
                        <option value="chromeheadless">Chrome headless</option>
                    </select>
                    <span class="muted">Next Execute / Automate / Record / Bug Hunter window. Environment variables still win if already set.</span>
                </label>
                <label class="check" style="display:flex;gap:0.5rem;align-items:center;">
                    <input type="checkbox" id="agentHarnessEnabled" name="agentHarnessEnabled"/>
                    <span><strong>Agent harness (AI validation)</strong> — install-wide kill switch. When off, every workspace's AI-validation toggle is ignored and all agent jobs skip cleanly.</span>
                    <span class="ok" id="agent-harness-saved" hidden style="margin-left:0.5rem;">Saved.</span>
                </label>
                <label>Cursor model (agent harness)
                    <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                        <select id="cursorModel" name="cursorModel" style="flex:1;min-width:14rem;">
                            <option value="auto">Auto — cheapest capable (recommended)</option>
                        </select>
                        <button type="button" class="btn ghost" id="btn-refresh-cursor-models">Refresh</button>
                    </div>
                    <div style="display:flex;gap:0.5rem;align-items:center;margin-top:0.5rem;flex-wrap:wrap;">
                        <input type="text" id="cursorModelCustom" placeholder="or type a model id (e.g. grok-code-fast-1)"
                               style="flex:1;min-width:14rem;" autocomplete="off" pattern="[a-z][a-z0-9.\-]{0,60}" />
                        <button type="button" class="btn ghost" id="btn-save-cursor-model-custom">Save</button>
                    </div>
                    <span class="muted">Model Cursor uses for TC review / framework repair / failure investigation / hunt triage. Curated list — if your model isn't shown, type its id above (Cursor validates at run time).</span>
                    <span class="ok" id="cursor-model-saved" hidden style="margin-left:0.5rem;">Saved.</span>
                </label>
            </div>
            <div style="margin-top:1.25rem;display:flex;gap:0.75rem;flex-wrap:wrap;">
                <button class="btn btn-primary" type="button" id="btn-save-llm">Save</button>
            </div>
        </form>
    </section>
</main>
</div>
<script th:inline="none">
(function () {
    const DEFAULT_OLLAMA = 'http://127.0.0.1:11434';
    const HDR = {
        'Accept': 'application/json',
        'Content-Type': 'application/json',
        'X-Keel-Requested-With': 'Keel'
    };
    const savedEl = document.getElementById('llm-saved');
    const errEl = document.getElementById('llm-error');
    let current = null;

    function showError(msg) {
        savedEl.hidden = true;
        errEl.hidden = !msg;
        errEl.textContent = msg || '';
    }
    function showSaved() {
        errEl.hidden = true;
        savedEl.hidden = false;
    }
    function ollamaUrlFromField() {
        const el = document.getElementById('ollamaBaseUrl');
        const v = el && el.value ? el.value.trim() : '';
        return v || DEFAULT_OLLAMA;
    }
    function setOllamaUrl(v) {
        const el = document.getElementById('ollamaBaseUrl');
        if (el) el.value = (v && String(v).trim()) || DEFAULT_OLLAMA;
    }
    function setSecretHint(field, configured, last4) {
        const input = document.getElementById(field);
        const hint = document.getElementById(field + 'Hint');
        if (!input || !hint) return;
        if (configured) {
            input.placeholder = '•••• configured' + (last4 ? ' (…' + last4 + ')' : '');
            hint.textContent = 'Leave blank to keep the current key.';
        } else {
            input.placeholder = 'Not configured';
            hint.textContent = '';
        }
        input.value = '';
    }
    function ensureOption(select, value) {
        if (!value) return;
        for (const opt of select.options) {
            if (opt.value === value) return;
        }
        const o = document.createElement('option');
        o.value = value;
        o.textContent = value;
        select.appendChild(o);
    }
    function fillModels(names, preferredChat, preferredVision) {
        const chat = document.getElementById('ollamaChatModel');
        const vision = document.getElementById('ollamaVisionModel');
        const list = Array.isArray(names) ? names.slice() : [];
        chat.innerHTML = '';
        vision.innerHTML = '';
        const blank = document.createElement('option');
        blank.value = '';
        blank.textContent = list.length ? '— select —' : '— no models yet —';
        chat.appendChild(blank.cloneNode(true));
        vision.appendChild(blank);
        for (const name of list) {
            const a = document.createElement('option');
            a.value = name;
            a.textContent = name;
            chat.appendChild(a);
            vision.appendChild(a.cloneNode(true));
        }
        ensureOption(chat, preferredChat);
        ensureOption(vision, preferredVision);
        if (preferredChat) chat.value = preferredChat;
        if (preferredVision) vision.value = preferredVision;
    }
    async function loadSettings() {
        showError('');
        const res = await fetch('/api/admin/llm-settings', { credentials: 'same-origin', headers: HDR });
        if (!res.ok) {
            showError('Could not load settings (' + res.status + ').');
            return;
        }
        current = await res.json();
        setOllamaUrl(current.ollamaBaseUrl);
        setSecretHint('cursorApiKey', !!current.cursorApiKeyConfigured, current.cursorApiKeyLast4);
        setSecretHint('agentrouterApiKey', !!current.agentrouterApiKeyConfigured, current.agentrouterApiKeyLast4);
        setSecretHint('ollamaApiKey', !!current.ollamaApiKeyConfigured, current.ollamaApiKeyLast4);
        fillModels(current.cachedOllamaModels || [], current.ollamaChatModel || '', current.ollamaVisionModel || '');
        ensureOption(document.getElementById('ollamaChatModel'), current.ollamaChatModel || '');
        ensureOption(document.getElementById('ollamaVisionModel'), current.ollamaVisionModel || '');
        if (current.ollamaChatModel) document.getElementById('ollamaChatModel').value = current.ollamaChatModel;
        if (current.ollamaVisionModel) document.getElementById('ollamaVisionModel').value = current.ollamaVisionModel;
        const batch = document.getElementById('reviewCasesPerBatch');
        if (batch) batch.value = current.reviewCasesPerBatch || 50;
        const browser = document.getElementById('browser');
        if (browser) browser.value = current.browser || 'edge';
    }
    async function refreshModels(quiet) {
        const hint = document.getElementById('llm-models-hint');
        if (!quiet) showError('');
        if (hint && !quiet) hint.textContent = 'Loading models from Ollama…';
        const btn = document.getElementById('btn-refresh-models');
        if (btn) btn.disabled = true;
        try {
            const baseUrl = ollamaUrlFromField();
            setOllamaUrl(baseUrl);
            const q = '?baseUrl=' + encodeURIComponent(baseUrl);
            const res = await fetch('/api/admin/llm-settings/ollama/models' + q, {
                credentials: 'same-origin', headers: HDR
            });
            const body = await res.json().catch(() => ({}));
            if (!res.ok) {
                const msg = body.message || ('Ollama models failed (' + res.status + ').');
                if (!quiet) showError(msg);
                if (hint) hint.textContent = msg;
                return;
            }
            const chatPref = document.getElementById('ollamaChatModel').value
                || (current && current.ollamaChatModel) || '';
            const visionPref = document.getElementById('ollamaVisionModel').value
                || (current && current.ollamaVisionModel) || '';
            fillModels(body.models || [], chatPref, visionPref);
            if (hint) {
                hint.textContent = body.unreachable
                    ? 'Ollama unreachable — showing last list.'
                    : ((body.models && body.models.length)
                        ? 'Loaded from Ollama at the base URL.'
                        : 'Ollama returned no models. Pull a chat model, then Refresh models.');
            }
        } finally {
            if (btn) btn.disabled = false;
        }
    }
    async function save() {
        showError('');
        const body = {
            ollamaBaseUrl: ollamaUrlFromField(),
            ollamaChatModel: document.getElementById('ollamaChatModel').value,
            ollamaVisionModel: document.getElementById('ollamaVisionModel').value,
            reviewCasesPerBatch: parseInt(document.getElementById('reviewCasesPerBatch').value, 10) || 50,
            browser: document.getElementById('browser').value
        };
        const cursor = document.getElementById('cursorApiKey').value;
        const agent = document.getElementById('agentrouterApiKey').value;
        const ollamaKey = document.getElementById('ollamaApiKey').value;
        if (cursor && cursor.trim()) body.cursorApiKey = cursor.trim();
        if (agent && agent.trim()) body.agentrouterApiKey = agent.trim();
        if (ollamaKey && ollamaKey.trim()) body.ollamaApiKey = ollamaKey.trim();
        const res = await fetch('/api/admin/llm-settings', {
            method: 'PUT',
            credentials: 'same-origin',
            headers: HDR,
            body: JSON.stringify(body)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            showError(data.message || data.error || ('Save failed (' + res.status + ').'));
            return;
        }
        current = data;
        setSecretHint('cursorApiKey', !!data.cursorApiKeyConfigured, data.cursorApiKeyLast4);
        setSecretHint('agentrouterApiKey', !!data.agentrouterApiKeyConfigured, data.agentrouterApiKeyLast4);
        setSecretHint('ollamaApiKey', !!data.ollamaApiKeyConfigured, data.ollamaApiKeyLast4);
        showSaved();
    }
    async function loadCursorModel(forceRefresh) {
        try {
            const url = forceRefresh ? '/api/admin/agent-harness/models/refresh' : '/api/admin/agent-harness';
            const res = await fetch(url, { credentials: 'same-origin', headers: HDR });
            if (!res.ok) return;
            const body = await res.json();
            const sel = document.getElementById('cursorModel');
            if (!sel) return;
            const models = Array.isArray(body.models) ? body.models : [];
            const current = body.cursorModel || sel.value || 'auto';
            sel.innerHTML = '';
            if (!models.length) {
                sel.appendChild(new Option('Auto — cheapest capable (recommended)', 'auto'));
            } else {
                for (const m of models) {
                    const label = m.displayName && m.displayName !== m.id
                        ? (m.id + ' — ' + m.displayName)
                        : m.id;
                    sel.appendChild(new Option(label, m.id));
                }
            }
            if ([...sel.options].some(o => o.value === current)) sel.value = current;
            const enabledBox = document.getElementById('agentHarnessEnabled');
            if (enabledBox) enabledBox.checked = !!body.enabled;
        } catch (_) { /* best-effort */ }
    }
    async function saveAgentHarnessEnabled(enabled) {
        const savedTag = document.getElementById('agent-harness-saved');
        if (savedTag) savedTag.hidden = true;
        try {
            const res = await fetch('/api/admin/agent-harness', {
                method: 'PUT', credentials: 'same-origin', headers: HDR,
                body: JSON.stringify({ enabled: !!enabled })
            });
            if (!res.ok) {
                const body = await res.json().catch(() => ({}));
                showError(body.message || ('Agent harness save failed (' + res.status + ').'));
                return;
            }
            if (savedTag) { savedTag.hidden = false; setTimeout(() => (savedTag.hidden = true), 2000); }
        } catch (e) {
            showError(String(e));
        }
    }
    async function saveCursorModel(v) {
        const savedTag = document.getElementById('cursor-model-saved');
        if (savedTag) savedTag.hidden = true;
        try {
            const res = await fetch('/api/admin/agent-harness', {
                method: 'PUT', credentials: 'same-origin', headers: HDR,
                body: JSON.stringify({ cursorModel: v })
            });
            if (!res.ok) {
                const body = await res.json().catch(() => ({}));
                showError(body.message || ('Cursor model save failed (' + res.status + ').'));
                return;
            }
            if (savedTag) { savedTag.hidden = false; setTimeout(() => (savedTag.hidden = true), 2000); }
        } catch (e) {
            showError(String(e));
        }
    }
    const cursorModelSel = document.getElementById('cursorModel');
    if (cursorModelSel) {
        cursorModelSel.addEventListener('change', function () { saveCursorModel(this.value); });
    }
    const agentHarnessBox = document.getElementById('agentHarnessEnabled');
    if (agentHarnessBox) {
        agentHarnessBox.addEventListener('change', function () { saveAgentHarnessEnabled(this.checked); });
    }
    const btnRefreshCursor = document.getElementById('btn-refresh-cursor-models');
    if (btnRefreshCursor) {
        btnRefreshCursor.addEventListener('click', function () {
            btnRefreshCursor.disabled = true;
            loadCursorModel(true).finally(() => { btnRefreshCursor.disabled = false; });
        });
    }
    const customIdInput = document.getElementById('cursorModelCustom');
    const btnSaveCustom = document.getElementById('btn-save-cursor-model-custom');
    async function saveCustomCursorModel() {
        if (!customIdInput) return;
        const v = (customIdInput.value || '').trim();
        if (!v) return;
        await saveCursorModel(v);
        customIdInput.value = '';
        await loadCursorModel(false);
    }
    if (btnSaveCustom) btnSaveCustom.addEventListener('click', saveCustomCursorModel);
    if (customIdInput) {
        customIdInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); saveCustomCursorModel(); }
        });
    }
    document.getElementById('btn-refresh-models').addEventListener('click', function () {
        refreshModels().catch(function (e) { showError(String(e)); });
    });
    document.getElementById('btn-save-llm').addEventListener('click', function () {
        save().catch(function (e) { showError(String(e)); });
    });
    loadSettings()
        .then(function () { return refreshModels(false); })
        .then(loadCursorModel)
        .catch(function (e) { showError(String(e)); });
})();
</script>
</body>
</html>

# عناوين الصفحات ومقدماتها
page.account.title=حسابي
page.admin-domains.title=النطاقات
page.admin-domains.lede=بيانات المواقع المحفوظة على هذا الخادم. حذف نطاق يحذف مجلد التخزين والمشاريع والتشغيلات المرتبطة به، فتعود لوحة المتابعة لهذا الموقع إلى البداية.
page.admin-llm-settings.title=النماذج ومفاتيح API
page.admin-llm-settings.lede=نماذج Ollama ومفاتيح الإصلاح لهذه النسخة من Keel. يغيّرها مالك الحساب فقط. تُحفظ القيم مشفّرة على الخادم، ومتغيرات البيئة تبقى لها الأولوية إذا كانت مضبوطة.
page.admin-pricing.title=الأسعار
page.admin-pricing.lede=حدّد الاسم وطريقة الاحتساب وسعر الوحدة الواحدة. كل تشغيل يضرب هذا السعر في عدد الوحدات التي يتضمنها، لكل الحسابات.
page.admin-prompts.title=التعليمات (Prompts)
page.admin-refunds.title=المبالغ المستردة
page.admin-refunds.lede=تشغيلات خُصم رصيدها ثم فشلت. أعطال المنصة (توقف المتصفح، الشبكة، توقف العامل، تعطل مزوّد النموذج) تفتح طلبًا تلقائيًا، ويمكن للمستخدم أيضًا أن يطلب من صفحة التشغيل. راجع الأدلة ثم أعد الرصيد كاملًا أو جزئيًا، أو ارفض مع سبب يراه المستخدم.
page.admin-roles.title=الأدوار والصلاحيات
page.admin-roles.lede=أنشئ أدوارًا مخصصة واختر ما يمكن لكل دور فعله. الموافقة على المستخدم تتم من صفحة المستخدمين، واختر الدور هناك في كل مرة.
page.admin-users.title=المستخدمون والدعوات
page.admin-users.lede=للمسؤول فقط — إدارة الحسابات.
page.bug-hunter.title=صائد الأخطاء
page.bug-hunter.lede=استكشف موقعك في متصفح حقيقي وابحث عن الأخطاء. تحصل على تقرير قابل للتنزيل — لا يُضاف شيء إلى مكتبة الحالات تلقائيًا.
page.dashboard.title=رؤية أوضح لكل تشغيل.
page.evidence.title=فرز الأدلة
page.execute.title=التنفيذ والتحقق
page.execute.lede=شغّل حالات الاختبار اليدوية على تطبيقك باستخدام بنية الصفحة ورؤية الشاشة — اكتشف الأخطاء قبل كتابة كود الأتمتة.
page.generate-from-knowledge.title=التوليد من حزم المعرفة
page.generate.title=اكتب حالات الاختبار
page.guide.title=الدليل
page.guide.lede=كيف تستخدم Keel يوميًا — كتابة الحالات، التوليد من المعرفة، تشغيل الاختبارات، مراجعة الأدلة، مقارنة الشاشات، جدولة المجموعات، بناء حزم الكود، صيد الأخطاء، وإدارة الرصيد. يحدد المالك أسعار الرصيد من الإدارة ← الأسعار.
page.invite.title=قبول الدعوة
page.jobs.title=التشغيلات
page.jobs.lede=سجل التوليد والأتمتة والتنفيذ لحسابك. افتح صفحة الحالة لمتابعة التقدم مباشرة.
page.login.title=تسجيل الدخول إلى Keel
page.packages.title=الأتمتة
page.packages.lede=حزم إطار العمل في كل المشاريع — افحص، نزّل، احذف، أو امسح مسودات الحالات المتبقية.
page.plain-cases.title=حالات بلغة بسيطة
page.pricing.title=الأسعار
page.projects.title=المشاريع
page.projects.lede=اضبط رابط الموقع وحسابات الدخول وملفات الأتمتة لكل مساحة عمل.
page.record.title=سجّل اختبارًا
page.record.lede=تنقّل في موقعك داخل Chrome. يكتب Keel كل خطوة ثم يحفظها كحالة اختبار. كلمات المرور لا تُحفظ.
page.request-access.title=طلب الوصول
page.run-memory.title=ذاكرة التشغيل
page.run-memory.lede=التقط تلميحات المحددات من التشغيلات السابقة. الذاكرة المعتمدة تُثبَّت تلقائيًا في تشغيلات التنفيذ الجديدة.
page.status.title=حالة التشغيل
page.structured-plans.title=الخطط المنظمة
page.structured-plans.lede=اكتب خطوات الإجراء والتحقق مع المراجعات. تُحفظ الخطط لكل مشروع لاستخدامها في المجموعات والتنفيذ.
page.suites.lede=اجمع حالات الاختبار في حزم موسومة (smoke / regression / nightly وحزمك الخاصة)، أرفق جدولًا وقناة تنبيه، وحوّل الحزمة الناجحة إلى مراقبة دائمة.
page.tc-guide.title=كيف تكتب حالات الاختبار
page.tc-guide.lede=كيف تملأ جدول حالات الاختبار ليشغّل Keel اختباراتك ويبني كود الأتمتة دون تخمين. قد تعيد أدوات الذكاء الاصطناعي صياغة حالاتك — فقط حافظ على عناوين الأعمدة.
page.upload.title=الأتمتة
page.upload.lede=ارفع ملف Excel. يبني Keel حزمة أتمتة يمكنك تنزيلها عند جاهزيتها. يُحتسب السعر مرة لكل حالة اختبار، وليس مرة للحزمة.


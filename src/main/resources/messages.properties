feature.help.overview.title=Overview
feature.help.overview.short=Dashboard with pass rate, runs that need attention, and execution trends for your workspace.
feature.help.overview.guide=/guide#overview
feature.help.projects.title=Projects
feature.help.projects.short=Each project is one site or app: URL, credentials, test library, and automation package.
feature.help.projects.guide=/guide#overview
feature.help.tcs-generation.title=TCs Generation
feature.help.tcs-generation.short=Write manual test cases from stories with AI, then import them into the project library.
feature.help.tcs-generation.guide=/guide#generate
feature.help.generate-stories.title=Story generate
feature.help.generate-stories.short=Turn one user story and acceptance criteria into test cases saved in the project workbook.
feature.help.generate-stories.guide=/guide#generate
feature.help.generate-bulk.title=Bulk CSV
feature.help.generate-bulk.short=Upload a CSV of many user stories; Keel queues one generate job per row in the background.
feature.help.generate-bulk.guide=/guide#generate
feature.help.generate-import.title=Paste external AI
feature.help.generate-import.short=Import CSV or JSON output from ChatGPT, Claude, or another tool after quality checks.
feature.help.generate-import.guide=/guide#generate
feature.help.generate-copy-prompt.title=Copy prompt
feature.help.generate-copy-prompt.short=Copy a project-aware prompt for an external AI chat, then paste the result into Import.
feature.help.generate-copy-prompt.guide=/guide#generate
feature.help.multi-model-generate.title=Multi-model generate
feature.help.multi-model-generate.short=Run the same stories through two AI models side by side and pick the better workbook.
feature.help.multi-model-generate.guide=/guide#generate
feature.help.generate-from-knowledge.title=Generate from knowledge
feature.help.generate-from-knowledge.short=Turn feature notes or case packs into new test cases grounded in what you already documented.
feature.help.generate-from-knowledge.guide=/guide#generate-from-knowledge
feature.help.playback.title=Playback
feature.help.playback.short=Record clicks in Chrome and save them as a test case (also called browser record).
feature.help.playback.guide=/guide#record
feature.help.plain-cases.title=Plain cases
feature.help.plain-cases.short=Author steps in everyday English before they become formal library cases.
feature.help.plain-cases.guide=/guide#plain-cases
feature.help.test-blueprints.title=Test blueprints
feature.help.test-blueprints.short=Structured action and assert plans with revisions, used by suites and execution workflows.
feature.help.test-blueprints.guide=/guide#test-blueprints
feature.help.test-suites.title=Test suites
feature.help.test-suites.short=Group test cases into smoke, regression, or nightly packs for scheduled or repeat runs.
feature.help.test-suites.guide=/guide#suites
feature.help.scheduling.title=Suite scheduling
feature.help.scheduling.short=Run a test pack on a timer and optionally alert you when a scheduled run fails.
feature.help.scheduling.guide=/guide#suites
feature.help.schedule-watch.title=Watch after green run
feature.help.schedule-watch.short=After a passing pack run, promote it to an always-on monitor that re-checks the same cases on prod or staging.
feature.help.schedule-watch.guide=/guide#suites
feature.help.tcs-execution.title=TCs execution
feature.help.tcs-execution.short=Run manual test cases in a real browser with vision and healing—not full automation code.
feature.help.tcs-execution.guide=/guide#execute
feature.help.tcs-automation.title=TCs automation
feature.help.tcs-automation.short=Convert library cases into Selenium or Appium code and download a runnable package.
feature.help.tcs-automation.guide=/guide#automate
feature.help.bug-hunter.title=Bug Hunter
feature.help.bug-hunter.short=Explore the site automatically to find bugs; you get a report, not new library cases.
feature.help.bug-hunter.guide=/guide#hunt
feature.help.history.title=History
feature.help.history.short=All generate, automate, and execute runs with status, downloads, and evidence links.
feature.help.history.guide=/guide#evidence
feature.help.run-memory.title=Run memory
feature.help.run-memory.short=Saved locators Keel reuses on later runs.
feature.help.run-memory.guide=/guide#run-memory
feature.help.run-memory-propose.title=Propose memory
feature.help.run-memory-propose.short=Draft a locator hint from a run; a teammate approves it before Execute can reuse it.
feature.help.run-memory-propose.guide=/guide#run-memory
feature.help.bug-hunter-triage.title=Review hunt report
feature.help.bug-hunter-triage.short=Confirm or dismiss bugs from a finished hunt before promoting any test-case candidates.
feature.help.bug-hunter-triage.guide=/guide#hunt
feature.help.pricing.title=Pricing
feature.help.pricing.short=See how Keel charges credits per job type before you start long runs.
feature.help.pricing.guide=/guide#credits

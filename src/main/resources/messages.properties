feature.help.dashboard-overview.short=Your workspace at a glance: projects, pass rate, items that need follow-up, and recent activity.
feature.help.dashboard-overview.guide=/guide#overview
feature.help.dashboard-trends.title=Execution trends
feature.help.dashboard-trends.short=Proven passes and blocked cases per day; filter by project or date to spot regressions.
feature.help.dashboard-trends.guide=/guide#overview
feature.help.dashboard-attention.title=Needs your attention
feature.help.dashboard-attention.short=Failed or blocked runs and setup issues that need a human decision.
feature.help.dashboard-attention.guide=/guide#overview
feature.help.dashboard-recent.title=Recent activity
feature.help.dashboard-recent.short=The last few runs across the workspace; open History for the full list.
feature.help.dashboard-recent.guide=/guide#evidence

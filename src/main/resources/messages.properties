# Page headings and intros (page.<template>.title / .lede)
page.account.title=My account
page.admin-domains.title=Domains
page.admin-domains.lede=Stored site data on this server. Deleting a domain removes the store folder and matching portal projects/jobs so the dashboard resets for that site.
page.admin-llm-settings.title=LLM & API keys
page.admin-llm-settings.lede=Install-wide Ollama models and heal API keys for this Keel portal. Only the account owner can change these. Values are stored encrypted on the portal host; environment variables still win when already set.
page.admin-pricing.title=Prices
page.admin-pricing.lede=Set the name, how it is charged, and the price of one unit. A job multiplies that price by how many units it includes, for every account.
page.admin-prompts.title=Prompts
page.admin-refunds.title=Refunds
page.admin-refunds.lede=Runs that were charged and then failed. Platform failures (browser crash, network, lost worker, model provider down) open a request automatically; users can also ask from the run page. Review the evidence, then refund in full, in part, or reject with a reason the user will see.
page.admin-roles.title=Roles & permissions
page.admin-roles.lede=Create custom roles and choose what each role can do. Approving a user still happens on Users — pick a role there every time.
page.admin-users.title=Users & invites
page.admin-users.lede=Admin only — manage accounts.
page.bug-hunter.title=Bug Hunter
page.bug-hunter.lede=Explore your website in a real browser and look for bugs. You get a downloadable report — nothing is added to your test library automatically.
page.dashboard.title=A clearer view of every run.
page.evidence.title=Evidence triage
page.execute.title=Execute & verify
page.execute.lede=Run manual test cases against your app with page structure and screen vision — find bugs before building automation code.
page.generate-from-knowledge.title=Generate from knowledge
page.generate.title=Write test cases
page.guide.title=Guide
page.guide.lede=How to use Keel day to day — write cases, generate from knowledge, run tests, review evidence, compare screens, schedule suites, build code packages, hunt bugs, and manage credits. Owner sets credit prices on Admin → Prices.
page.invite.title=Accept invite
page.jobs.title=Runs
page.jobs.lede=Generate, Automate, and Execute history for your account. Open status for live progress.
page.login.title=Sign in to Keel
page.packages.title=Automation
page.packages.lede=Framework packages across all projects — inspect, download, delete, or clear leftover proven-case drafts.
page.plain-cases.title=Plain-English cases
page.pricing.title=Pricing
page.projects.title=Projects
page.projects.lede=Configure website URL, login accounts, and automation files per workspace.
page.record.title=Record a test
page.record.lede=Click through your website in Chrome. Keel writes each step, then saves it as a test case. Passwords are not stored.
page.request-access.title=Request access
page.run-memory.title=Run memory
page.run-memory.lede=Capture locator hints from past runs. Approved memory is pinned into new execute jobs automatically.
page.status.title=Run status
page.structured-plans.title=Structured plans
page.structured-plans.lede=Author action and assert steps with revisions. Plans are stored per project for suite and execute workflows.
page.suites.lede=Pack test cases into tagged test packs (smoke / regression / nightly + your packs), attach a schedule and alert channel, and promote a green pack to an always-on monitor. Tags can filter Run tests / step checks once Backend wires the filter — display only until then.
page.tc-guide.title=How to write test cases
page.tc-guide.lede=How to fill in the test case spreadsheet so Keel can run your tests and build automation code without guessing. AI tools may reword your cases — just keep the column headers.
page.upload.title=Automate
page.upload.lede=Upload your Excel workbook. Keel builds an automation package you can download when ready. The price is charged once for each test case, not once for the package.

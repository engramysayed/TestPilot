delivery.dry-run=false
delivery.hunt.dom-mode=auto
delivery.hunt.knowledge-packs.enabled=true
delivery.store-root=./delivery-store
delivery.work-dir=./delivery-work
delivery.template-root=./customer-framework-template
# Optional Ollama polish for generated test method names only (pages stay deterministic)
delivery.codegen.ollama-naming=false

delivery.llm-base-url=http://127.0.0.1:11434
delivery.llm-model=gemma4:26b
delivery.generate-model=gemma4:26b
delivery.generate-models=gemma4:26b,gemma4:e2b,qwen2.5:latest
# Per-story wait for async generate jobs (gemma JSON batches often exceed 2 minutes)
delivery.generate-timeout-seconds=600
# Long TC JSON batches need more than Ollama's ~1k default (else done_reason=length)
delivery.generate-num-predict=8192
delivery.admin-email=${KEEL_ADMIN_EMAIL:admin@localhost}
delivery.admin-password=${KEEL_ADMIN_PASSWORD:please-change}
delivery.invite-expiry-days=14
delivery.retention.days=14
delivery.public-base-url=http://localhost:8080
# Explicit provider allowlist. Empty fails closed. Precision/Keel is not a privacy control.
delivery.provider.allowlist=ollama,cursor,agentrouter,vision
# shared | dedicated — dedicated may add delivery.install.private-cidrs
delivery.install.mode=shared
# delivery.install.private-cidrs=10.0.0.0/8
delivery.jobs.max-queued-per-tenant=20
delivery.jobs.max-running-per-install=8
# Production installs must set delivery.install.production=true and a non-default admin password.
delivery.install.production=false

# Prove/heal browser: headless avoids Chrome/Edge popping over your desktop
delivery.browser.headless=false
# delivery.browser.type=CHROME


# Heal cascade layer 3: Cursor Auto sidecar (no model pin — Auto is hard-locked in tools/cursor-heal)
delivery.cursor-heal.enabled=true
delivery.cursor-heal.command=node tools/cursor-heal/heal.mjs
delivery.heal.invent.enabled=true
delivery.heal.invent.provider=cursor
delivery.heal.invent.max-per-tc=2
# Only used when provider=agentrouter; set a cheap model here, invent runs per failed step
# delivery.heal.invent.agentrouter.model=
delivery.heal.vision-widen.enabled=true

# Unified agent harness (Phase 1 foundation — off by default; no Cursor wiring yet)
delivery.agent-harness.enabled=false
delivery.agent-harness.cursor.enabled=false
delivery.agent-harness.max-concurrent-runs=2
delivery.agent-harness.max-runtime-minutes=15
delivery.agent-harness.max-retries=1
delivery.agent-harness.framework-validation.enabled=false
delivery.agent-harness.failure-investigation.enabled=false

# Precision authoring engine (Cursor groundRank sidecar; Keel remains default per job)
delivery.authoring.precision.enabled=true
delivery.authoring.precision.max-calls-per-job=50

# Honesty demotion (D5/D6) — off by default; set true to demote thin PASSes
delivery.honesty-demote=false
# Final revise (AgentRouter / Opus) — also requires portal "Client delivery" checkbox
delivery.final-revise.enabled=false
delivery.final-revise.base-url=https://agentrouter.org
delivery.final-revise.model=claude-opus-5
# Set key via env AGENTROUTER_API_KEY (do not commit secrets)
# delivery.final-revise.api-key=
# Customer ZIP mvn compile smoke before COMPLETED (set false if Maven missing)
delivery.emit-compile-check=true

# Invite emails + AL-1 email alerts. Set env vars in keel-env.local.bat and flip delivery.mail-enabled=true.
delivery.mail-enabled=${KEEL_MAIL_ENABLED:false}
delivery.mail-from=${KEEL_MAIL_FROM:noreply@yourdomain.com}
spring.mail.host=${KEEL_MAIL_HOST:}
spring.mail.port=${KEEL_MAIL_PORT:587}
spring.mail.username=${KEEL_MAIL_USERNAME:}
spring.mail.password=${KEEL_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

server.port=8080
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.thymeleaf.cache=false

# Issue #2: no AUTO_SERVER (it opened an H2 TCP port with user sa and an empty password).
# Only the portal process opens this file; stop the portal before using external H2 tools.
spring.datasource.url=jdbc:h2:file:./delivery-store/portal-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
# Never commit a value: set KEEL_DB_PASSWORD (env or external config). Empty = startup refused under prod, warning in dev.
# Existing DBs with the old empty password are migrated once (keel.db.migrate-empty-password=true).
spring.datasource.password=${KEEL_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Flip dry-run back on without code changes:
# delivery.dry-run=true

# Vision grounding (Layer 1.5 + heal bbox). Off = DOM bind only.
delivery.vision.grounding.enabled=true
delivery.vision.assertions.enabled=true
delivery.vision.heal-hints.enabled=true
# Prefer ground/assert keys only (do not set delivery.vision.provider / .model).
# Suitable jobs: UI-TARS grounds/heals; Qwen judges visual asserts.
delivery.vision.grounding.provider=uitars
delivery.vision.grounding.model=ui-tars
# Assertion vision model: auto | uitars (default) | qwen (qwen2.5vl:7b, Apache-2.0, via Ollama).
# auto = qwen only on a GPU with >= 12 GB VRAM (nvidia-smi, or hint delivery.vision.gpu.vram-gb), else uitars.
# qwen2.5vl runs on CPU via Ollama (no NVIDIA required) but is slow; this PC keeps uitars for asserts.
delivery.vision.assert.provider=uitars
delivery.vision.assert.model=ui-tars
delivery.vision.dom-post-click.enabled=true
delivery.vision.dom-post-click.strict=false
delivery.vision.miss-log.enabled=true
delivery.vision.miss-log.dir=delivery-store/vision-misses
# Keel portal: Admin → Domains wipes delivery-store/<domain>/

# B06 (Phase 0a): runner API v2 on the existing 8080 connector, runner token + HMAC request signing.
# Separate runner connector and mTLS are Phase 0b and stay off; ProductionSafetyGuard refuses
# mtls.required=false together with a production install or keel.topology=split.
keel.topology=single
keel.runner.connector.enabled=false
keel.runner.mtls.required=false
keel.runner.v2.chunk-max-bytes=8388608

# B08 (Phase 0a): per-kind dispatch, inprocess|remote. remote = the engine (start-engine.cmd) claims the job over
# Runner API v2 on 8080. The 0a engine runs execute and convert; remote for other kinds refuses startup.
# inprocess is the migration fallback (removed in 0b). Flip to remote at 0a exit (B13).
keel.jobs.dispatch.default=inprocess

# B12 (Phase 0a): AL-1 in-portal engine dead-man check. Off so a closed engine console does not page.
# Those three channels stay log-only. Account alerts (a failed or blocked run) are separate and use
# keel.alerts.telegram.bot-token plus delivery.mail-enabled.
keel.alerts.telegram.bot-token=${KEEL_TELEGRAM_BOT_TOKEN:}
keel.alerts.engine-deadman.enabled=false
keel.alerts.engine-deadman.minutes=5
keel.alerts.engine-deadman.muted-engines=
keel.alerts.mute-minutes=60
keel.alerts.evaluate-ms=60000
keel.alerts.channels.telegram.enabled=${KEEL_ALERT_TELEGRAM_ENABLED:false}
keel.alerts.channels.telegram.min-severity=warning
keel.alerts.channels.email.enabled=${KEEL_ALERT_EMAIL_ENABLED:false}
keel.alerts.channels.email.min-severity=critical

# AL-1 real senders (B12 → B13). Each channel is off until its enabled flag is true. When enabled,
# at least one address is required or the send fails.
# Email: requires delivery.mail-enabled=true and spring.mail.* (host, port, username, password).
#        Recipients from keel.alerts.channels.email.recipients (comma-separated) or KEEL_ALERT_EMAIL_RECIPIENTS.
# Telegram: reuses keel.alerts.telegram.bot-token / KEEL_TELEGRAM_BOT_TOKEN. Chat ids from
#        keel.alerts.channels.telegram.chat-ids (comma-separated) or KEEL_TELEGRAM_CHAT_IDS.
keel.alerts.channels.email.recipients=${KEEL_ALERT_EMAIL_RECIPIENTS:}
keel.alerts.channels.telegram.chat-ids=${KEEL_TELEGRAM_CHAT_IDS:}

# Keel Credits (user-level; separate from project BudgetLedger / precision units)
delivery.credits.enabled=true
delivery.credits.cost.generate=10
delivery.credits.cost.execute=5
delivery.credits.cost.automate=25
delivery.credits.cost.hunt=15

# M0 mobile (QA 0056 / LD-01): base/CI default stays OFF (no device required).
# Product/live enables devices via Spring profile `product` -> application-product.properties.
# CI dual opt-in for dedicated mobile jobs still requires BOTH:
#   -Ddelivery.mobile.enabled=true AND -Dkeel.mobile.ci-opt-in=true
# (see MobileFeatureFlagDefaultsTest / scripts/ci/check-mobile-flag-off.sh / mobile-guard.yml).
delivery.mobile.enabled=false
delivery.mobile.live-tests=false

# Portal enhancements (5, 11-12) — triage off by default; structured intake on
delivery.hunt.triage.enabled=true
delivery.generate.structured-intake=true

# Sidebar IA + Roles UI
delivery.sidebar.ia-enabled=true
delivery.roles.ui-enabled=true

delivery.mobile.upload-max-bytes=524288000
delivery.mobile.apkanalyzer-path=apkanalyzer
delivery.mobile.aapt2-path=aapt2
delivery.mobile.inspect-timeout-seconds=30
delivery.mobile.allow-downgrade=false
delivery.mobile.allow-signature-replacement=false

# Absolute folder of editable prompt files (mirrors env KEEL_PROMPTS_DIR). Leave unset to use classpath prompts/
keel.prompts.dir=

# Slice F: portal in-process schedule worker (off by default; set true for live HOME firing)
delivery.suites.portal-schedule-worker.enabled=true
delivery.suites.portal-schedule-worker.fixed-delay-ms=30000
delivery.suites.portal-schedule-worker.within-seconds=0
# Cron schedules without their own "timezone" are evaluated in this zone.
delivery.suites.schedule-zone=Africa/Cairo
# A slot missed for longer than this (Keel was down) is skipped and recorded as MISSED instead of firing late.
delivery.suites.misfire-grace-minutes=60

# Adopt A5: cloud tunnel broker (relay + agent poll).
# tunnel.public-base-url MUST be a dedicated host (e.g. https://tunnel.keel.example), not the portal host:
# relayed pages would otherwise run same-origin with the portal. Same host => relay disabled. Loopback = dev mode.
delivery.tunnel.enabled=false
delivery.tunnel.public-base-url=
# Agent heartbeats every 15s; a tunnel with no heartbeat for this long is treated as offline (stale)
delivery.tunnel.heartbeat-ttl-seconds=60

# Refund requests (Admin -> Refunds). Platform failures (RetryCategory.INFRA) on charged jobs open a PENDING
# request automatically; owners can also request from the run page. Account owner approves/rejects.
delivery.credits.refunds.auto-open=true
delivery.credits.refunds.sweep-ms=120000
delivery.credits.refunds.sweep-lookback-hours=72
# Durable jobs: periodic reclaim of expired leases (workers renew every 15s via LeaseKeeper)
delivery.jobs.lease-reconcile-ms=60000
# Mobile run maintenance: frees abandoned/expired device leases (no caller existed before 2026-11-07)
delivery.mobile.lease-maintenance-ms=30000

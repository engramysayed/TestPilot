delivery.dry-run=false
delivery.hunt.dom-mode=auto
delivery.store-root=./delivery-store
delivery.work-dir=./delivery-work
delivery.template-root=./customer-framework-template
# Optional Ollama polish for generated test method names only (pages stay deterministic)
delivery.codegen.ollama-naming=false

delivery.llm-base-url=http://127.0.0.1:11434
delivery.llm-model=gemma4:e2b
delivery.generate-model=gemma4:e2b
delivery.generate-models=gemma4:e2b,qwen2.5:latest
# Per-story wait for async generate jobs (gemma JSON batches often exceed 2 minutes)
delivery.generate-timeout-seconds=600
# Long TC JSON batches need more than Ollama's ~1k default (else done_reason=length)
delivery.generate-num-predict=8192
delivery.admin-email=admin@localhost
delivery.admin-password=ChangeMeAdmin1!
delivery.invite-expiry-days=14
delivery.retention.days=14
delivery.public-base-url=http://localhost:8080
# Explicit provider allowlist. Empty fails closed. Precision/Keel is not a privacy control.
delivery.provider.allowlist=ollama,cursor,agentrouter,vision
# shared | dedicated Ã¢â‚¬â€ dedicated may add delivery.install.private-cidrs
delivery.install.mode=shared
# delivery.install.private-cidrs=10.0.0.0/8
delivery.jobs.max-queued-per-tenant=20
delivery.jobs.max-running-per-install=8
# Production installs must set delivery.install.production=true and a non-default admin password.
delivery.install.production=false

# Prove/heal browser: headless avoids Chrome/Edge popping over your desktop
delivery.browser.headless=false
# delivery.browser.type=CHROME


# Heal cascade layer 3: Cursor Auto sidecar (no model pin Ã¢â‚¬â€ Auto is hard-locked in tools/cursor-heal)
delivery.cursor-heal.enabled=true
delivery.cursor-heal.command=node tools/cursor-heal/heal.mjs
delivery.heal.invent.enabled=true
delivery.heal.invent.provider=cursor
delivery.heal.invent.max-per-tc=2
# Only used when provider=agentrouter; set a cheap model here, invent runs per failed step
# delivery.heal.invent.agentrouter.model=
delivery.heal.vision-widen.enabled=true

# Precision authoring engine (Cursor groundRank sidecar; Keel remains default per job)
delivery.authoring.precision.enabled=true
delivery.authoring.precision.max-calls-per-job=50

# Honesty demotion (D5/D6) Ã¢â‚¬â€ off by default; set true to demote thin PASSes
delivery.honesty-demote=false
# Final revise (AgentRouter / Opus) Ã¢â‚¬â€ also requires portal "Client delivery" checkbox
delivery.final-revise.enabled=false
delivery.final-revise.base-url=https://agentrouter.org
delivery.final-revise.model=claude-opus-5
# Set key via env AGENTROUTER_API_KEY (do not commit secrets)
# delivery.final-revise.api-key=
# Customer ZIP mvn compile smoke before COMPLETED (set false if Maven missing)
delivery.emit-compile-check=true

# Invite emails (set enabled=true and fill SMTP to actually send)
delivery.mail-enabled=false
delivery.mail-from=noreply@yourdomain.com

server.port=8080
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.thymeleaf.cache=false

# Issue #2: no AUTO_SERVER (it opened an H2 TCP port with user sa and an empty password).
# Only the portal process opens this file; stop the portal before using external H2 tools.
spring.datasource.url=jdbc:h2:file:./delivery-store/portal-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
# Never commit a value: set KEEL_DB_PASSWORD (env or external config). Empty = startup refused under prod, warning in dev.
# Existing DBs with the old empty password are migrated once (keel.db.migrate-empty-password=true).
spring.datasource.password=${KEEL_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Flip dry-run back on without code changes:
# delivery.dry-run=true

# Vision grounding (Layer 1.5 + heal bbox). Off = DOM bind only.
delivery.vision.grounding.enabled=true
delivery.vision.assertions.enabled=true
delivery.vision.heal-hints.enabled=true
# Prefer ground/assert keys only (do not set delivery.vision.provider / .model).
# Suitable jobs: UI-TARS grounds/heals; Qwen judges visual asserts.
delivery.vision.grounding.provider=uitars
delivery.vision.grounding.model=ui-tars
# Assertion vision model: auto | uitars (default) | qwen (qwen2.5vl:7b, Apache-2.0, via Ollama).
# auto = qwen only on a GPU with >= 12 GB VRAM (nvidia-smi, or hint delivery.vision.gpu.vram-gb), else uitars.
delivery.vision.assert.provider=uitars
delivery.vision.assert.model=ui-tars
delivery.vision.dom-post-click.enabled=true
delivery.vision.dom-post-click.strict=false
delivery.vision.miss-log.enabled=true
delivery.vision.miss-log.dir=delivery-store/vision-misses
# Keel portal: Admin Ã¢â€ â€™ Domains wipes delivery-store/<domain>/

# B06 (Phase 0a): runner API v2 on the existing 8080 connector, runner token + HMAC request signing.
# Separate runner connector and mTLS are Phase 0b and stay off; ProductionSafetyGuard refuses
# mtls.required=false together with a production install or keel.topology=split.
keel.topology=single
keel.runner.connector.enabled=false
keel.runner.mtls.required=false
keel.runner.v2.chunk-max-bytes=8388608

# B08 (Phase 0a): per-kind dispatch, inprocess|remote. remote = the engine (start-engine.cmd) claims the job over
# Runner API v2 on 8080. The 0a engine runs execute and convert; remote for other kinds refuses startup.
# inprocess is the migration fallback (removed in 0b). Flip to remote at 0a exit (B13).
keel.jobs.dispatch.default=inprocess

# B12 (Phase 0a): AL-1 in-portal engine dead-man check (SPLIT_DESIGN rev 10 Ã‚Â§8). Off in 0a so a closed engine console
# doesn't page; enabled in 0b. Channels are pluggable stubs (log only) until AL-1 picks Telegram/email/Slack.
keel.alerts.engine-deadman.enabled=false
keel.alerts.engine-deadman.minutes=5
keel.alerts.engine-deadman.muted-engines=
keel.alerts.mute-minutes=60
keel.alerts.evaluate-ms=60000
keel.alerts.channels.telegram.enabled=false
keel.alerts.channels.telegram.min-severity=warning
keel.alerts.channels.email.enabled=false
keel.alerts.channels.email.min-severity=critical
keel.alerts.channels.slack.enabled=false
keel.alerts.channels.slack.min-severity=warning

# Keel Credits (user-level; separate from project BudgetLedger / precision units)
delivery.credits.enabled=true
delivery.credits.cost.generate=10
delivery.credits.cost.execute=5
delivery.credits.cost.automate=25
delivery.credits.cost.hunt=15

# M0 mobile (QA 0056): platform admission/UI/runner paths stay off until explicitly enabled.
# Default CI and Phase 0a never require a device. Opt-in: -Ddelivery.mobile.enabled=true AND
# -Dkeel.mobile.ci-opt-in=true (see MobileFeatureFlagDefaultsTest / .github/workflows/mobile-guard.yml).
delivery.mobile.enabled=true
delivery.mobile.live-tests=false

# Portal enhancements (5, 11-12) â€” triage off by default; structured intake on
delivery.hunt.triage.enabled=true
delivery.generate.structured-intake=true

# Sidebar IA + Roles UI
delivery.sidebar.ia-enabled=true
delivery.roles.ui-enabled=true

delivery.mobile.upload-max-bytes=524288000
delivery.mobile.apkanalyzer-path=apkanalyzer
delivery.mobile.aapt2-path=aapt2
delivery.mobile.inspect-timeout-seconds=30
delivery.mobile.allow-downgrade=false
delivery.mobile.allow-signature-replacement=false

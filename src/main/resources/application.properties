delivery.dry-run=false
delivery.store-root=./delivery-store
delivery.work-dir=./delivery-work
delivery.template-root=./customer-framework-template
delivery.llm-base-url=http://127.0.0.1:11434
delivery.llm-model=gemma4:e2b
delivery.admin-email=admin@testpilot.local
delivery.admin-password=ChangeMeAdmin1!
delivery.invite-expiry-days=14
delivery.public-base-url=http://localhost:8080

# Heal cascade layer 3: Cursor Auto sidecar (no model pin — Auto is hard-locked in tools/cursor-heal)
delivery.cursor-heal.enabled=true
delivery.cursor-heal.command=node tools/cursor-heal/heal.mjs
delivery.heal.invent.enabled=true
delivery.heal.invent.provider=cursor
delivery.heal.invent.max-per-tc=2
delivery.heal.vision-widen.enabled=true

# Honesty demotion (D5/D6) — off by default; set true to demote thin PASSes
delivery.honesty-demote=false
# Final revise (AgentRouter / Opus) — also requires portal "Client delivery" checkbox
delivery.final-revise.enabled=true
delivery.final-revise.base-url=https://agentrouter.org
delivery.final-revise.model=claude-opus-4-8
# Set key via env AGENTROUTER_API_KEY (do not commit secrets)
# delivery.final-revise.api-key=
# Customer ZIP mvn compile smoke before COMPLETED (set false if Maven missing)
delivery.emit-compile-check=true

# Invite emails (set enabled=true and fill SMTP to actually send)
delivery.mail-enabled=false
delivery.mail-from=noreply@yourdomain.com

server.port=8080
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.thymeleaf.cache=false

spring.datasource.url=jdbc:h2:file:./delivery-store/portal-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Flip dry-run back on without code changes:
# delivery.dry-run=true

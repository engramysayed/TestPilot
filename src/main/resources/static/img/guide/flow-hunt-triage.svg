<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-labelledby="t2">
  <title id="t2">Bug Hunt triage — confirm is not promote</title>
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3aa0e8"/></marker>
  </defs>
  <rect width="720" height="180" rx="12" fill="#121820"/>
  <rect x="20" y="50" width="120" height="70" rx="10" fill="#1a2330" stroke="#3aa0e8" stroke-width="1.5"/>
  <text x="80" y="82" text-anchor="middle" fill="#e8eef6" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Hunt run</text>
  <text x="80" y="100" text-anchor="middle" fill="#8fa0b8" font-family="system-ui,sans-serif" font-size="11">findings</text>
  <line x1="140" y1="85" x2="180" y2="85" stroke="#3aa0e8" stroke-width="2" marker-end="url(#arr2)"/>
  <rect x="180" y="50" width="130" height="70" rx="10" fill="#1a2330" stroke="#e6b23c" stroke-width="1.5"/>
  <text x="245" y="82" text-anchor="middle" fill="#e8eef6" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Review queue</text>
  <text x="245" y="100" text-anchor="middle" fill="#8fa0b8" font-family="system-ui,sans-serif" font-size="11">decide each bug</text>
  <line x1="310" y1="85" x2="350" y2="85" stroke="#3aa0e8" stroke-width="2" marker-end="url(#arr2)"/>
  <rect x="350" y="30" width="140" height="55" rx="10" fill="#1a2330" stroke="#3ecf8e" stroke-width="1.5"/>
  <text x="420" y="54" text-anchor="middle" fill="#e8eef6" font-family="system-ui,sans-serif" font-size="13" font-weight="600">CONFIRMED</text>
  <text x="420" y="72" text-anchor="middle" fill="#8fa0b8" font-family="system-ui,sans-serif" font-size="10">triage accept only</text>
  <rect x="350" y="100" width="140" height="55" rx="10" fill="#1a2330" stroke="#8fa0b8" stroke-width="1.5"/>
  <text x="420" y="124" text-anchor="middle" fill="#e8eef6" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Dismissed</text>
  <text x="420" y="142" text-anchor="middle" fill="#8fa0b8" font-family="system-ui,sans-serif" font-size="10">not a real bug</text>
  <line x1="490" y1="57" x2="540" y2="57" stroke="#e6b23c" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr2)"/>
  <rect x="540" y="30" width="160" height="55" rx="10" fill="#1a2330" stroke="#e6b23c" stroke-width="1.5"/>
  <text x="620" y="54" text-anchor="middle" fill="#e8eef6" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Promote (separate)</text>
  <text x="620" y="72" text-anchor="middle" fill="#e6b23c" font-family="system-ui,sans-serif" font-size="10">CONFIRMED ≠ promote</text>
  <text x="360" y="172" fill="#8fa0b8" font-family="system-ui,sans-serif" font-size="11">Nothing is added to your test library until you explicitly promote.</text>
</svg>

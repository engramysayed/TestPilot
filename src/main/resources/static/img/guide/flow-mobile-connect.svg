<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" role="img" aria-labelledby="t3">
  <title id="t3">Mobile — Appium, emulator or USB device, APK or installed app</title>
  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3aa0e8"/></marker>
  </defs>
  <rect width="720" height="170" rx="12" fill="#121820"/>
  <rect x="20" y="45" width="130" height="80" rx="10" fill="#1a2330" stroke="#e6b23c" stroke-width="1.5"/>
  <text x="85" y="78" text-anchor="middle" fill="#e8eef6" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Appium</text>
  <text x="85" y="98" text-anchor="middle" fill="#8fa0b8" font-family="system-ui,sans-serif" font-size="11">prerequisite</text>
  <line x1="150" y1="85" x2="190" y2="85" stroke="#3aa0e8" stroke-width="2" marker-end="url(#arr3)"/>
  <rect x="190" y="20" width="150" height="55" rx="10" fill="#1a2330" stroke="#3aa0e8" stroke-width="1.5"/>
  <text x="265" y="44" text-anchor="middle" fill="#e8eef6" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Emulator</text>
  <text x="265" y="62" text-anchor="middle" fill="#8fa0b8" font-family="system-ui,sans-serif" font-size="10">AVD / virtual device</text>
  <rect x="190" y="95" width="150" height="55" rx="10" fill="#1a2330" stroke="#3aa0e8" stroke-width="1.5"/>
  <text x="265" y="119" text-anchor="middle" fill="#e8eef6" font-family="system-ui,sans-serif" font-size="12" font-weight="600">USB / UDID</text>
  <text x="265" y="137" text-anchor="middle" fill="#8fa0b8" font-family="system-ui,sans-serif" font-size="10">real phone + debugging</text>
  <line x1="340" y1="85" x2="390" y2="85" stroke="#3aa0e8" stroke-width="2" marker-end="url(#arr3)"/>
  <rect x="390" y="20" width="150" height="55" rx="10" fill="#1a2330" stroke="#0d9aa8" stroke-width="1.5"/>
  <text x="465" y="44" text-anchor="middle" fill="#e8eef6" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Upload APK</text>
  <text x="465" y="62" text-anchor="middle" fill="#8fa0b8" font-family="system-ui,sans-serif" font-size="10">inspect + launcher</text>
  <rect x="390" y="95" width="150" height="55" rx="10" fill="#1a2330" stroke="#0d9aa8" stroke-width="1.5"/>
  <text x="465" y="119" text-anchor="middle" fill="#e8eef6" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Installed app</text>
  <text x="465" y="137" text-anchor="middle" fill="#8fa0b8" font-family="system-ui,sans-serif" font-size="10">package already on device</text>
  <line x1="540" y1="85" x2="580" y2="85" stroke="#3aa0e8" stroke-width="2" marker-end="url(#arr3)"/>
  <rect x="580" y="45" width="120" height="80" rx="10" fill="#1a2330" stroke="#3ecf8e" stroke-width="1.5"/>
  <text x="640" y="78" text-anchor="middle" fill="#e8eef6" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Run tests</text>
  <text x="640" y="98" text-anchor="middle" fill="#8fa0b8" font-family="system-ui,sans-serif" font-size="11">Execute / Hunt</text>
</svg>
